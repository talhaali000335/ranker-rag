<!doctype html>                                              <!-- says this is modern HTML -->
<html lang="en">
<head>
  <meta charset="utf-8">                                     <!-- allow all letters and symbols -->
  <meta name="viewport" content="width=device-width, initial-scale=1">   <!-- fit phone screens -->
  <meta name="csrf-token" content="{{ csrf_token }}">        <!-- Django's security token, read by our JavaScript -->
  <title>{% block title %}Ranker RAG{% endblock %}</title>   <!-- browser tab title; pages can replace it -->
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, Segoe UI, Arial, sans-serif; background: #f5f5f2; color: #222; }
    header { background: #3c3489; color: #fff; padding: 14px 20px; font-weight: 600; font-size: 18px; }
    main { max-width: 760px; margin: 24px auto; padding: 0 16px; }
  </style>
</head>
<body>
  <header>Ranker RAG</header>                                <!-- the purple top bar -->
  <main>
    {% block content %}{% endblock %}                        <!-- a page puts its content here -->
  </main>
  {% block scripts %}{% endblock %}                          <!-- a page puts its JavaScript here -->
</body>
</html>
